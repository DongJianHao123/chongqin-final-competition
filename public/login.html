<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 广阳岛比赛平台</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/platform.css"></head>
<body>
  <main class="login-wrap">
    <section class="card login-card">
      <div class="brand"><span class="brand-mark">AI</span><span>广阳岛比赛平台</span></div>
      <p id="status" class="notice" hidden></p>
      <form id="loginForm">
        <div class="field"><label for="loginUsername">用户名</label><input id="loginUsername" required autocomplete="username"></div>
        <div class="field"><label for="loginPassword">密码</label><input id="loginPassword" type="password" required autocomplete="current-password"></div>
        <button class="primary full" type="submit">登录并进入平台</button>
      </form>
      <div class="guest-entry">
        <button id="guestButton" class="full" type="button">以游客身份进入</button>
      </div>
    </section>
  </main>
  <script src="/platform-login.js"></script>
</body></html>
